# Public-repository release manifest.
#
# Run from the repository root:
#   python3 tools/release/check_release.py \
#     --manifest tools/release/copies.example.toml --workspace .

[build]
# pdfimages counts the three alpha masks as images in addition to the four
# visible manuscript figures.
expected_images = 7

[transformations]
# Retained for compatibility with port_manuscript.py. The public release has
# one canonical manuscript, so no cross-copy transformation is performed.
figure_prefix = 3
schematic_path = 1
bibliography = 1

[figures]
# Render simulation/simulation_study.qmd before running the figure check.
source = "simulation/simulation_study_files/figure-html"
consumers = ["manuscript/figures"]

[schematic]
filename = "Figure1_Composed_Design.png"
consumers = ["manuscript/figures"]

[[manuscript]]
name = "public"
tex = "manuscript/JSM_2026_Manuscript.tex"
pdf = "manuscript/JSM_2026_Manuscript.pdf"
figure_prefix = "figures/"
bibliography = "references"
abstract = "env"
canonical = true

[scope]
release = ["README.md", "manuscript/", "simulation/"]
skip_dirs = [".git", "_archive", "_cache", "simulation_study_files",
             "__pycache__", "release"]
allow_window = 320
allow_regions = []
allow = [
  "not a clean negative control", "not mechanism isolation",
  "not an attributable share", "not quantified prior-data conflict",
  "defined against the prior predictive", "stress-test summary",
]

[[retracted]]
pattern = '0\.0771|7\.7\s*(?:%|percent)'
label = "obsolete headline T1E"

[[retracted]]
pattern = '0\.1274|0\.1266'
label = "obsolete Rule B values"

[[retracted]]
pattern = '0\.1350|0\.1072'
label = "obsolete departure-by-trend values"

[[retracted]]
pattern = '(mild|strong|moderate)\s+conflict|conflict scenarios?'
label = "conflict label used for anchor departure"

[[retracted]]
pattern = 'zhou_lee_yuan'
label = "incorrect monitoring-boundary source"

[[retracted]]
pattern = 'Seaman III, James'
label = "incorrect RBesT author"

[[retracted]]
pattern = 'Common control/experimental rate'
label = "obsolete composite-null axis label"

[[retracted]]
pattern = 'monitoring-only cell|robustness failure in the monitoring'
label = "unsupported monitoring attribution"
